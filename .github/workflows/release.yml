name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag, for example 0.1.0 or v0.1.0."
        required: false
        type: string
      publish_pypi:
        description: "Publish the built Python distribution to PyPI using trusted publishing."
        required: false
        default: false
        type: boolean
      public_launch:
        description: "Require public-launch proof mode; fails unless publish_pypi is enabled."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate public launch inputs
        env:
          PUBLIC_LAUNCH: ${{ inputs.public_launch }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$PUBLIC_LAUNCH" = "true" ] && [ "$PUBLISH_PYPI" != "true" ]; then
              echo "public_launch=true requires publish_pypi=true so PyPI trusted-publishing evidence can be collected." >&2
              exit 1
            fi
          fi

      - name: Record release mode
        env:
          PUBLIC_LAUNCH: ${{ inputs.public_launch }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MODE="Public launch candidate"
            PYPI_MODE="PyPI trusted publishing runs automatically for v* tags."
          elif [ "$PUBLIC_LAUNCH" = "true" ]; then
            MODE="Public launch candidate"
            PYPI_MODE="PyPI trusted publishing was requested for this manual dispatch."
          elif [ "$PUBLISH_PYPI" = "true" ]; then
            MODE="PyPI publish candidate"
            PYPI_MODE="Manual PyPI trusted publishing was requested without public-launch proof mode."
          else
            MODE="GitHub-only release candidate"
            PYPI_MODE="PyPI trusted publishing was not requested for this manual dispatch."
          fi
          {
            echo "## PolicyNIM release mode"
            echo "- Mode: ${MODE}"
            echo "- PyPI: ${PYPI_MODE}"
            echo "- Public launch proof still requires strict OSS readiness evidence from docs/launch-evidence.json."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group test --group dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run offline pytest
        run: uv run pytest -q -m "not live and not docker_live"

      - name: Check release notes
        run: |
          python3 scripts/check_release_notes.py --format json >/tmp/policynim-release-notes.json
          python3 -m json.tool /tmp/policynim-release-notes.json >/tmp/policynim-release-notes-json-ok.txt

      - name: Check OSS readiness evidence contract
        run: |
          python3 scripts/oss_readiness_check.py --format json >/tmp/policynim-oss-readiness.json
          python3 -m json.tool /tmp/policynim-oss-readiness.json >/tmp/policynim-oss-readiness-json-ok.txt

      - name: Build Python distribution
        run: uv build --out-dir dist

      - name: Upload Python distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  wheel-smoke:
    runs-on: ubuntu-24.04
    needs: verify
    env:
      NVIDIA_API_KEY: ""
    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Smoke install built wheel
        run: |
          python -m venv /tmp/policynim-wheel-smoke
          mkdir -p /tmp/policynim-wheel-cwd
          /tmp/policynim-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/policynim-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp/policynim-wheel-cwd
          /tmp/policynim-wheel-smoke/bin/policynim --help
          /tmp/policynim-wheel-smoke/bin/policynim init --help >/tmp/policynim-init-help.txt
          grep -F "Usage: policynim init" /tmp/policynim-init-help.txt
          /tmp/policynim-wheel-smoke/bin/policynim ingest --help >/tmp/policynim-ingest-help.txt
          grep -F "Usage: policynim ingest" /tmp/policynim-ingest-help.txt
          /tmp/policynim-wheel-smoke/bin/policynim preflight --help >/tmp/policynim-preflight-help.txt
          grep -F "Usage: policynim preflight" /tmp/policynim-preflight-help.txt
          /tmp/policynim-wheel-smoke/bin/policynim quickstart --format json >/tmp/policynim-quickstart.json
          /tmp/policynim-wheel-smoke/bin/policynim quickstart --target local-cli --format json >/tmp/policynim-quickstart-local-cli.json
          /tmp/policynim-wheel-smoke/bin/policynim quickstart --target local-mcp --format json >/tmp/policynim-quickstart-local-mcp.json
          /tmp/policynim-wheel-smoke/bin/policynim doctor --format json >/tmp/policynim-doctor.json
          /tmp/policynim-wheel-smoke/bin/policynim support-bundle >/tmp/policynim-support-bundle.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-smoke --format json >/tmp/policynim-mcp-smoke.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-config --help
          /tmp/policynim-wheel-smoke/bin/policynim mcp-config --client codex --target local-stdio --format json >/tmp/policynim-mcp-config.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-config --client claude-code --target local-stdio --format json >/tmp/policynim-claude-mcp-config.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-smoke --mcp-config-file /tmp/policynim-mcp-config.json --format json >/tmp/policynim-mcp-smoke-from-codex-config.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-smoke --mcp-config-file /tmp/policynim-claude-mcp-config.json --format json >/tmp/policynim-mcp-smoke-from-claude-config.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-config --target hosted-http --client codex --hosted-url https://example.invalid/mcp --bearer-token-env-var POLICYNIM_TOKEN --format json >/tmp/policynim-hosted-mcp-config.json
          /tmp/policynim-wheel-smoke/bin/policynim mcp-config --target hosted-http --client claude-code --hosted-url https://example.invalid/mcp --bearer-token-env-var POLICYNIM_TOKEN --format json >/tmp/policynim-claude-hosted-mcp-config.json
          python -m json.tool /tmp/policynim-quickstart.json >/tmp/policynim-quickstart-json-ok.txt
          python -m json.tool /tmp/policynim-quickstart-local-cli.json >/tmp/policynim-quickstart-local-cli-json-ok.txt
          python -m json.tool /tmp/policynim-quickstart-local-mcp.json >/tmp/policynim-quickstart-local-mcp-json-ok.txt
          python -m json.tool /tmp/policynim-doctor.json >/tmp/policynim-doctor-json-ok.txt
          python -m json.tool /tmp/policynim-support-bundle.json >/tmp/policynim-support-bundle-json-ok.txt
          python -m json.tool /tmp/policynim-mcp-smoke.json >/tmp/policynim-mcp-smoke-json-ok.txt
          python -m json.tool /tmp/policynim-mcp-config.json >/tmp/policynim-mcp-config-json-ok.txt
          python -m json.tool /tmp/policynim-claude-mcp-config.json >/tmp/policynim-claude-mcp-config-json-ok.txt
          python -m json.tool /tmp/policynim-mcp-smoke-from-codex-config.json >/tmp/policynim-mcp-smoke-from-codex-config-json-ok.txt
          python -m json.tool /tmp/policynim-mcp-smoke-from-claude-config.json >/tmp/policynim-mcp-smoke-from-claude-config-json-ok.txt
          python -m json.tool /tmp/policynim-hosted-mcp-config.json >/tmp/policynim-hosted-mcp-config-json-ok.txt
          python -m json.tool /tmp/policynim-claude-hosted-mcp-config.json >/tmp/policynim-claude-hosted-mcp-config-json-ok.txt
          python "${GITHUB_WORKSPACE}/scripts/release_check.py" --validate-json-contract mcp-config-codex-local-stdio /tmp/policynim-mcp-config.json
          python "${GITHUB_WORKSPACE}/scripts/release_check.py" --validate-json-contract mcp-config-claude-code-local-stdio /tmp/policynim-claude-mcp-config.json
          python "${GITHUB_WORKSPACE}/scripts/release_check.py" --validate-json-contract mcp-config-codex-hosted-http /tmp/policynim-hosted-mcp-config.json
          python "${GITHUB_WORKSPACE}/scripts/release_check.py" --validate-json-contract mcp-config-claude-code-hosted-http /tmp/policynim-claude-hosted-mcp-config.json
          /tmp/policynim-wheel-smoke/bin/policynim --version

      - name: Upload release wheel smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wheel-smoke-evidence
          path: |
            /tmp/policynim-init-help.txt
            /tmp/policynim-ingest-help.txt
            /tmp/policynim-preflight-help.txt
            /tmp/policynim-quickstart.json
            /tmp/policynim-quickstart-local-cli.json
            /tmp/policynim-quickstart-local-mcp.json
            /tmp/policynim-doctor.json
            /tmp/policynim-support-bundle.json
            /tmp/policynim-mcp-smoke.json
            /tmp/policynim-mcp-config.json
            /tmp/policynim-claude-mcp-config.json
            /tmp/policynim-mcp-smoke-from-codex-config.json
            /tmp/policynim-mcp-smoke-from-claude-config.json
            /tmp/policynim-hosted-mcp-config.json
            /tmp/policynim-claude-hosted-mcp-config.json
          if-no-files-found: error
          retention-days: 30

  standalone-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            archive: tar
          - os: macos-14
            platform: darwin-arm64
            archive: tar
          - os: macos-15-intel
            platform: darwin-amd64
            archive: tar
          - os: windows-2022
            platform: windows-amd64
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      NVIDIA_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              requested_version = tag.removeprefix("v")
          else:
              requested = os.environ.get("REQUESTED_VERSION", "").strip()
              if requested:
                  requested_version = requested.removeprefix("v")
                  tag = f"v{requested_version}"
              else:
                  requested_version = project_version
                  tag = f"v{project_version}"
          if requested_version != project_version:
              raise SystemExit(
                  "Release version mismatch: "
                  f"requested {requested_version}, pyproject.toml has {project_version}."
              )
          print(f"RELEASE_TAG={tag}")
          PY

      - name: Sync release dependencies
        run: uv sync --group release

      - name: Build standalone bundle
        run: uv run --group release pyinstaller --clean --noconfirm packaging/pyinstaller.spec

      - name: Smoke standalone bundle
        shell: bash
        run: |
          SMOKE_EVIDENCE="$PWD/smoke-evidence"
          STANDALONE_SMOKE_CWD="$PWD/standalone-smoke-cwd"
          mkdir -p "$SMOKE_EVIDENCE" "$STANDALONE_SMOKE_CWD"
          if [ "${{ matrix.platform }}" = "windows-amd64" ]; then
            POLICYNIM_STANDALONE="$PWD/dist/policynim/policynim.exe"
          else
            POLICYNIM_STANDALONE="$PWD/dist/policynim/policynim"
          fi
          cd "$STANDALONE_SMOKE_CWD"
          "$POLICYNIM_STANDALONE" --help
          "$POLICYNIM_STANDALONE" init --help >"$SMOKE_EVIDENCE/policynim-standalone-init-help.txt"
          "$POLICYNIM_STANDALONE" ingest --help >"$SMOKE_EVIDENCE/policynim-standalone-ingest-help.txt"
          "$POLICYNIM_STANDALONE" preflight --help >"$SMOKE_EVIDENCE/policynim-standalone-preflight-help.txt"
          "$POLICYNIM_STANDALONE" doctor --format json >"$SMOKE_EVIDENCE/policynim-standalone-doctor.json"
          "$POLICYNIM_STANDALONE" quickstart --format json >"$SMOKE_EVIDENCE/policynim-standalone-quickstart.json"
          "$POLICYNIM_STANDALONE" quickstart --target local-cli --format json >"$SMOKE_EVIDENCE/policynim-standalone-quickstart-local-cli.json"
          "$POLICYNIM_STANDALONE" quickstart --target local-mcp --format json >"$SMOKE_EVIDENCE/policynim-standalone-quickstart-local-mcp.json"
          "$POLICYNIM_STANDALONE" support-bundle >"$SMOKE_EVIDENCE/policynim-standalone-support-bundle.json"
          "$POLICYNIM_STANDALONE" mcp-smoke --format json >"$SMOKE_EVIDENCE/policynim-standalone-mcp-smoke.json"
          "$POLICYNIM_STANDALONE" mcp-config --help
          "$POLICYNIM_STANDALONE" mcp-config --client codex --target local-stdio --format json >"$SMOKE_EVIDENCE/policynim-standalone-mcp-config.json"
          "$POLICYNIM_STANDALONE" mcp-config --client claude-code --target local-stdio --format json >"$SMOKE_EVIDENCE/policynim-standalone-claude-mcp-config.json"
          "$POLICYNIM_STANDALONE" mcp-smoke --mcp-config-file "$SMOKE_EVIDENCE/policynim-standalone-mcp-config.json" --format json >"$SMOKE_EVIDENCE/policynim-standalone-mcp-smoke-from-codex-config.json"
          "$POLICYNIM_STANDALONE" mcp-smoke --mcp-config-file "$SMOKE_EVIDENCE/policynim-standalone-claude-mcp-config.json" --format json >"$SMOKE_EVIDENCE/policynim-standalone-mcp-smoke-from-claude-config.json"
          "$POLICYNIM_STANDALONE" mcp-config --target hosted-http --client codex --hosted-url https://example.invalid/mcp --bearer-token-env-var POLICYNIM_TOKEN --format json >"$SMOKE_EVIDENCE/policynim-standalone-hosted-mcp-config.json"
          "$POLICYNIM_STANDALONE" mcp-config --target hosted-http --client claude-code --hosted-url https://example.invalid/mcp --bearer-token-env-var POLICYNIM_TOKEN --format json >"$SMOKE_EVIDENCE/policynim-standalone-claude-hosted-mcp-config.json"
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-quickstart.json" >/tmp/policynim-standalone-quickstart-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-quickstart-local-cli.json" >/tmp/policynim-standalone-quickstart-local-cli-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-quickstart-local-mcp.json" >/tmp/policynim-standalone-quickstart-local-mcp-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-doctor.json" >/tmp/policynim-standalone-doctor-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-support-bundle.json" >/tmp/policynim-standalone-support-bundle-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-mcp-smoke.json" >/tmp/policynim-standalone-mcp-smoke-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-mcp-config.json" >/tmp/policynim-standalone-mcp-config-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-claude-mcp-config.json" >/tmp/policynim-standalone-claude-mcp-config-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-mcp-smoke-from-codex-config.json" >/tmp/policynim-standalone-mcp-smoke-from-codex-config-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-mcp-smoke-from-claude-config.json" >/tmp/policynim-standalone-mcp-smoke-from-claude-config-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-hosted-mcp-config.json" >/tmp/policynim-standalone-hosted-mcp-config-json-ok.txt
          python -m json.tool "$SMOKE_EVIDENCE/policynim-standalone-claude-hosted-mcp-config.json" >/tmp/policynim-standalone-claude-hosted-mcp-config-json-ok.txt
          python "$GITHUB_WORKSPACE/scripts/release_check.py" --validate-json-contract mcp-config-codex-local-stdio "$SMOKE_EVIDENCE/policynim-standalone-mcp-config.json"
          python "$GITHUB_WORKSPACE/scripts/release_check.py" --validate-json-contract mcp-config-claude-code-local-stdio "$SMOKE_EVIDENCE/policynim-standalone-claude-mcp-config.json"
          python "$GITHUB_WORKSPACE/scripts/release_check.py" --validate-json-contract mcp-config-codex-hosted-http "$SMOKE_EVIDENCE/policynim-standalone-hosted-mcp-config.json"
          python "$GITHUB_WORKSPACE/scripts/release_check.py" --validate-json-contract mcp-config-claude-code-hosted-http "$SMOKE_EVIDENCE/policynim-standalone-claude-hosted-mcp-config.json"
          grep -F "Usage: policynim init" "$SMOKE_EVIDENCE/policynim-standalone-init-help.txt"
          grep -F "Usage: policynim ingest" "$SMOKE_EVIDENCE/policynim-standalone-ingest-help.txt"
          grep -F "Usage: policynim preflight" "$SMOKE_EVIDENCE/policynim-standalone-preflight-help.txt"
          "$POLICYNIM_STANDALONE" --version

      - name: Upload standalone smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-smoke-evidence-${{ matrix.platform }}
          path: |
            smoke-evidence/policynim-standalone-init-help.txt
            smoke-evidence/policynim-standalone-ingest-help.txt
            smoke-evidence/policynim-standalone-preflight-help.txt
            smoke-evidence/policynim-standalone-quickstart.json
            smoke-evidence/policynim-standalone-quickstart-local-cli.json
            smoke-evidence/policynim-standalone-quickstart-local-mcp.json
            smoke-evidence/policynim-standalone-doctor.json
            smoke-evidence/policynim-standalone-support-bundle.json
            smoke-evidence/policynim-standalone-mcp-smoke.json
            smoke-evidence/policynim-standalone-mcp-config.json
            smoke-evidence/policynim-standalone-claude-mcp-config.json
            smoke-evidence/policynim-standalone-mcp-smoke-from-codex-config.json
            smoke-evidence/policynim-standalone-mcp-smoke-from-claude-config.json
            smoke-evidence/policynim-standalone-hosted-mcp-config.json
            smoke-evidence/policynim-standalone-claude-hosted-mcp-config.json
          if-no-files-found: error
          retention-days: 30

      - name: Archive Unix standalone bundle
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ matrix.platform }}" in
            linux-amd64) ASSET_NAME="policynim-${RELEASE_TAG}-linux-amd64.tar.gz" ;;
            darwin-arm64) ASSET_NAME="policynim-${RELEASE_TAG}-darwin-arm64.tar.gz" ;;
            darwin-amd64) ASSET_NAME="policynim-${RELEASE_TAG}-darwin-amd64.tar.gz" ;;
            *) echo "Unsupported release platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          tar -C dist -czf "artifacts/${ASSET_NAME}" policynim

      - name: Archive Windows standalone bundle
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $RELEASE_TAG = $env:RELEASE_TAG
          $AssetName = "policynim-${RELEASE_TAG}-windows-amd64.zip"
          Compress-Archive -Path "dist/policynim/*" -DestinationPath "artifacts/$AssetName" -Force

      - name: Upload standalone bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish-github-release:
    runs-on: ubuntu-24.04
    needs:
      - verify
      - wheel-smoke
      - standalone-build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Python distribution for release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: release-downloads/python-dist

      - name: Download Linux standalone bundle for release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-linux-amd64
          path: release-downloads/standalone-linux-amd64

      - name: Download Apple Silicon macOS standalone bundle for release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-darwin-arm64
          path: release-downloads/standalone-darwin-arm64

      - name: Download Intel macOS standalone bundle for release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-darwin-amd64
          path: release-downloads/standalone-darwin-amd64

      - name: Download Windows standalone bundle for release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-windows-amd64
          path: release-downloads/standalone-windows-amd64

      - name: Resolve release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              requested_version = tag.removeprefix("v")
          else:
              requested = os.environ.get("REQUESTED_VERSION", "").strip()
              if requested:
                  requested_version = requested.removeprefix("v")
                  tag = f"v{requested_version}"
              else:
                  requested_version = project_version
                  tag = f"v{project_version}"
          if requested_version != project_version:
              raise SystemExit(
                  "Release version mismatch: "
                  f"requested {requested_version}, pyproject.toml has {project_version}."
              )
          print(f"RELEASE_TAG={tag}")
          PY

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-downloads -type f -exec cp {} release-assets/ \;
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          RELEASE_VERSION="${RELEASE_TAG#v}"
          python3 scripts/release_manifest.py release-assets \
            --tag "$RELEASE_TAG" \
            --source-sha "$GITHUB_SHA" \
            --expected "install.sh" \
            --expected "install.ps1" \
            --expected "policynim-${RELEASE_VERSION}.tar.gz" \
            --expected "policynim-${RELEASE_VERSION}-py3-none-any.whl" \
            --expected "policynim-${RELEASE_TAG}-linux-amd64.tar.gz" \
            --expected "policynim-${RELEASE_TAG}-darwin-arm64.tar.gz" \
            --expected "policynim-${RELEASE_TAG}-darwin-amd64.tar.gz" \
            --expected "policynim-${RELEASE_TAG}-windows-amd64.zip"
          python3 scripts/check_release_notes.py --write-github-release-notes release-notes.md
          grep -F "SHA256SUMS" release-notes.md
          grep -F "RELEASE_MANIFEST.json" release-notes.md
          grep -F "artifact attestations" release-notes.md

      - name: Generate release asset attestations
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: release-assets/SHA256SUMS
          show-summary: true

      - name: Verify release asset attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p attestation-evidence
          ASSET_PATH="release-assets/install.sh"
          OUTPUT_PATH="attestation-evidence/install-sh-attestation.json"
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --format json > "$OUTPUT_PATH"; then
              python3 -m json.tool "$OUTPUT_PATH" >/tmp/policynim-attestation-json-ok.txt
              exit 0
            fi
            if [ "$attempt" = "5" ]; then
              break
            fi
            sleep 10
          done
          echo "Could not verify GitHub artifact attestation for ${ASSET_PATH}." >&2
          exit 1

      - name: Upload release attestation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-attestation-evidence
          path: attestation-evidence/install-sh-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            release-assets/*

  publish-pypi:
    runs-on: ubuntu-24.04
    needs:
      - publish-github-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        # This Docker-based action publishes GHCR images under release tags, not commit SHA tags.
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
