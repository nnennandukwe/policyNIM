[project]
name = "policynim"
version = "0.1.1"
description = "A policy-aware NVIDIA NIM engineering preflight layer for AI coding agents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Nnenna Ndukwe" },
]
license = { file = "LICENSE" }
keywords = ["ai-agents", "cli", "code-quality", "mcp", "nvidia-nim", "policy", "preflight", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "arize-phoenix==13.21.0",
  "arize-phoenix-evals==2.12.0",
  "httpx==0.27.2",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "markdown-it-py==4.0.0",
  "mcp[cli]==1.26.0",
  "openai==2.29.0",
  "pandas==2.2.3",
  "platformdirs==4.5.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "sqlite-vec==0.1.9",
  "typer==0.24.1",
]

[project.urls]
Changelog = "https://github.com/nnennandukwe/policyNIM/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nnennandukwe/policyNIM/tree/main/docs"
Issues = "https://github.com/nnennandukwe/policyNIM/issues"
Repository = "https://github.com/nnennandukwe/policyNIM"
Releases = "https://github.com/nnennandukwe/policyNIM/releases"
Roadmap = "https://github.com/nnennandukwe/policyNIM/blob/main/docs/roadmap.md"
Security = "https://github.com/nnennandukwe/policyNIM/blob/main/SECURITY.md"
Support = "https://github.com/nnennandukwe/policyNIM/blob/main/SUPPORT.md"

[project.optional-dependencies]
nvidia-guardrails = [
  "nemoguardrails[nvidia]==0.21.0",
]
nvidia-eval = [
  "nemo-evaluator==0.2.5",
  "nvidia-nat-eval==1.6.0",
  "nvidia-simple-evals==26.3",
]
nvidia-eval-launcher = [
  "nemo-evaluator-launcher==0.2.4",
  "nvidia-nat[eval]==1.6.0",
]

[project.scripts]
policynim = "policynim.interfaces.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policynim"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "policynim/policies"
"evals" = "policynim/evals"

[dependency-groups]
test = [
  "pytest==8.3.4",
]
dev = [
  "pre-commit==4.3.0",
  "pyright==1.1.409",
  "ruff==0.15.7",
]
release = [
  "pyinstaller==6.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
  "live: tests that make real NVIDIA API calls and are excluded from offline CI",
  "docker_live: tests that require a working Docker daemon and an explicit opt-in env gate",
]
